name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            extra: ""
          - python-version: "3.12"
            extra: ""
          - python-version: "3.10"
            extra: "[mcp]"
          - python-version: "3.12"
            extra: "[mcp]"
          - python-version: "3.12"
            extra: "[mcp,otel]"
            # The SDK is test-only: it provides InMemorySpanExporter.
            test-deps: opentelemetry-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".${{ matrix.extra }}" ${{ matrix.test-deps }}
      - name: Run tests
        run: python runtests.py
  test-postgres:
    # Runs the suite on PostgreSQL 17 so the select_for_update branch of
    # execute is exercised against a database that supports row locking
    # (SQLite does not). The driver is installed here only, not in setup.py.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBPURGE_TEST_DB_ENGINE: postgresql
      DBPURGE_TEST_DB_HOST: localhost
      DBPURGE_TEST_DB_PORT: "5432"
      DBPURGE_TEST_DB_USER: postgres
      DBPURGE_TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and PostgreSQL driver
        run: |
          python -m pip install --upgrade pip
          pip install ".[mcp]" "psycopg[binary]>=3,<4"
      - name: Run tests on PostgreSQL
        run: python runtests.py
  lint:
    # Tool versions are pinned so a new ruff or mypy release cannot break CI
    # on an unrelated branch. The package is installed with the [mcp] and
    # [otel] extras so fastmcp and opentelemetry imports resolve for mypy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package, ruff and mypy
        run: |
          python -m pip install --upgrade pip
          pip install ".[mcp,otel]" ruff==0.17.4 mypy==2.4.1
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy
  adversarial:
    # Red-team suite for the MCP tools. pytest and pytest-django are pinned to
    # the versions verified locally so a new release cannot break CI. The
    # upload steps run even when a step fails, so the results are always kept.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[mcp]" pytest==9.1.1 pytest-django==4.14.0
      - name: Run adversarial suite
        run: >
          pytest -m adversarial tests/adversarial
          --junitxml=junit.xml --adversarial-json=results.json
      - name: Check the committed results table is current
        run: python -m tests.adversarial.report results.json --check
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-results
          path: |
            junit.xml
            results.json
          if-no-files-found: ignore
  wheel-smoke-test:
    # Proves the built wheel actually contains dbpurge's code and that
    # Django can discover its management commands. runtests.py alone
    # cannot catch a wheel that ships no code: it imports dbpurge from
    # this checkout, never through anything installed. Every step here
    # after the build runs from outside the checkout for that reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke-venv"
          "$RUNNER_TEMP/wheel-smoke-venv/bin/pip" install --quiet dist/*.whl
      - name: Write a minimal settings module outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-smoke-settings"
          cat > "$RUNNER_TEMP/wheel-smoke-settings/settings.py" <<'EOF'
          SECRET_KEY = "smoke"
          INSTALLED_APPS = ["dbpurge"]
          DATABASES = {"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}}
          USE_TZ = True
          EOF
      - name: Import the command modules and run --help, away from the checkout
        working-directory: ${{ runner.temp }}
        env:
          DJANGO_SETTINGS_MODULE: settings
          PYTHONPATH: ${{ runner.temp }}/wheel-smoke-settings
        run: |
          "$RUNNER_TEMP/wheel-smoke-venv/bin/python" -c "
          import dbpurge.management.commands.db_purge
          import dbpurge.management.commands.purge_mcp_server
          print('dbpurge command modules import cleanly from the installed wheel')
          "
          "$RUNNER_TEMP/wheel-smoke-venv/bin/python" -m django help purge_mcp_server
          "$RUNNER_TEMP/wheel-smoke-venv/bin/python" -m django help db_purge
