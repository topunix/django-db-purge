# Tool configuration only. Packaging stays in setup.py, so this file has no
# [build-system] or [project] table.

[tool.ruff]
line-length = 88
target-version = "py310"
# Lint scope is Python source. Markdown code samples may be deliberately partial.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Imports must follow django.setup(), so they cannot sit at the top of the file.
"tests/seed_demo.py" = ["E402"]
# Extends tests.settings by star import, so names come from a star import.
"tests/demo_settings.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["dbpurge"]

# Django ships no type information without django-stubs, which is out of scope.
# Allow its untyped imports here only, never globally.
[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true
