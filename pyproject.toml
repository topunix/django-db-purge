# Tool configuration only. Packaging stays in setup.py, so this file has no
# [build-system] or [project] table.

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["dbpurge"]

# Django ships no type information without django-stubs, which is out of scope.
# Allow its untyped imports here only, never globally.
[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true
